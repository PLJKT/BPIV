<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BPIV Group Information System</title>
  <link rel="stylesheet" href="assets/css/style.css?v=6">
  <script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
</head>
<body>

  <!-- Login screen -->
  <div id="login-screen" class="login-overlay" style="display:none;">
    <div class="login-box">
      <div class="login-logo">BPIV</div>
      <div class="login-subtitle" id="login-title">Group Information System</div>
      <div id="login-error" class="login-error" style="display:none;"></div>
      <input type="text" id="login-username" placeholder="Username" autocomplete="username">
      <input type="password" id="login-password" placeholder="Password" autocomplete="current-password">
      <button id="login-btn">Sign In</button>
      <div class="login-lang-row">
        <button class="login-lang" data-lang="en">EN</button>
        <button class="login-lang" data-lang="zh">中文</button>
        <button class="login-lang" data-lang="id">ID</button>
      </div>
    </div>
  </div>

  <!-- Main app -->
  <div id="app" style="display:none;">
    <header class="topbar">
      <div class="brand" id="brand-home">
        <span class="title" id="app-title">BPIV Group Information System</span>
        <span class="subtitle" id="app-subtitle"></span>
      </div>
      <div class="topbar-right">
        <span class="user-info" id="user-info"></span>
        <div class="lang-switch">
          <button class="lang-btn" id="lang-en">English</button>
          <button class="lang-btn" id="lang-zh">中文</button>
          <button class="lang-btn" id="lang-id">Bahasa Indonesia</button>
        </div>
        <button class="lang-btn" id="user-mgmt-btn" style="display:none;">⚙ <span id="user-mgmt-label">Users</span></button>
        <button class="lang-btn" id="logout-btn">↩ <span id="logout-label">Logout</span></button>
      </div>
    </header>
    <nav class="tabs">
      <a id="nav-dashboard" href="#/">Dashboard</a>
      <a id="nav-companies" href="#/">Portfolio Companies</a>
      <a id="nav-admin" href="#/admin" style="display:none;">User Management</a>
    </nav>
    <main id="main"></main>
    <footer class="foot">
      <div id="foot-source"></div>
      <div id="foot-disclaimer"></div>
    </footer>
  </div>

  <script src="assets/js/data.js?v=6"></script>
  <script src="assets/js/i18n.js?v=6"></script>
  <script src="assets/js/auth.js?v=6"></script>
  <script src="assets/js/app.js?v=6"></script>
</body>
</html>
